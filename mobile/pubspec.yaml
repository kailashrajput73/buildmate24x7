name: buildmate_app
description: BuildMate 24x7 app for customers and trade partners (plumbers, electricians, contractors).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  flutter_cashfree_pg_sdk: ^2.2.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  firebase_auth: ^5.3.3
  intl: ^0.20.3
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/branding/
    - assets/images/categories/
    - assets/images/professions/
