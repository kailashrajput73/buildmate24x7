# Builds the Android app on GitHub's servers — no Flutter needed on your PC.
# Run it from GitHub → Actions → "Android APK" → Run workflow, then download the APK from the run's Artifacts.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API address a phone can reach, e.g. https://api.buildmate24x7.in or a tunnel URL (not localhost / 10.0.2.2)"
        required: true
      auth_mode:
        description: "firebase (real SMS, needs GOOGLE_SERVICES_JSON secret) or otp (API's own OTP / mock)"
        required: true
        default: "otp"
  # Automatic builds use the repository variable API_URL (Settings → Secrets and variables → Actions → Variables).
  push:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.3"
          cache: true

      # Optional: Firebase config for real SMS login. Add the file's contents as a repository secret.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # A phone can't reach the emulator / PC-only addresses, so refuse to build an APK that can't connect.
      - name: Check API address
        env:
          API_URL: ${{ github.event.inputs.api_url || vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "::error::Set the API address (workflow input api_url, or repository variable API_URL)."; exit 1; fi
          case "$API_URL" in
            *10.0.2.2*|*localhost*|*127.0.0.1*|*0.0.0.0*) echo "::error::$API_URL only works on a PC or emulator, not on a phone."; exit 1;;
          esac
          echo "Building for $API_URL"

      - run: flutter pub get

      # Shows every compile problem in the log; doesn't stop the build on style warnings.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_URL=${{ github.event.inputs.api_url || vars.API_URL }}
          --dart-define=AUTH_MODE=${{ github.event.inputs.auth_mode || 'otp' }}

      - uses: actions/upload-artifact@v4
        with:
          name: buildmate-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
