# Independent local foundation. Deploy with: docker compose -p buildmate-image-cloud up -d --build
name: buildmate-image-cloud

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${IMAGE_CLOUD_DB_NAME:?Set IMAGE_CLOUD_DB_NAME}
      POSTGRES_USER: ${IMAGE_CLOUD_DB_USER:?Set IMAGE_CLOUD_DB_USER}
      POSTGRES_PASSWORD: ${IMAGE_CLOUD_DB_PASSWORD:?Set IMAGE_CLOUD_DB_PASSWORD}
    volumes:
      - image_cloud_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [image_cloud_private]

  api:
    build: ./backend
    environment:
      IMAGE_CLOUD_DATABASE_URL: ${IMAGE_CLOUD_DATABASE_URL:?Set IMAGE_CLOUD_DATABASE_URL}
      IMAGE_CLOUD_JWT_SECRET: ${IMAGE_CLOUD_JWT_SECRET:?Set IMAGE_CLOUD_JWT_SECRET}
      IMAGE_CLOUD_JWT_TTL_MINUTES: ${IMAGE_CLOUD_JWT_TTL_MINUTES:-30}
      IMAGE_CLOUD_ENABLE_API_DOCS: ${IMAGE_CLOUD_ENABLE_API_DOCS:-false}
      IMAGE_CLOUD_BOOTSTRAP_ADMIN_EMAIL: ${IMAGE_CLOUD_BOOTSTRAP_ADMIN_EMAIL:?Set IMAGE_CLOUD_BOOTSTRAP_ADMIN_EMAIL}
      IMAGE_CLOUD_BOOTSTRAP_ADMIN_PASSWORD: ${IMAGE_CLOUD_BOOTSTRAP_ADMIN_PASSWORD:?Set IMAGE_CLOUD_BOOTSTRAP_ADMIN_PASSWORD}
      IMAGE_CLOUD_CORS_ORIGINS: '${IMAGE_CLOUD_CORS_ORIGINS:-["http://localhost:5173"]}'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IMAGE_CLOUD_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [image_cloud_private]

  dashboard:
    build: ./dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IMAGE_CLOUD_DASHBOARD_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [image_cloud_private]

volumes:
  image_cloud_db:

networks:
  image_cloud_private:
    driver: bridge
