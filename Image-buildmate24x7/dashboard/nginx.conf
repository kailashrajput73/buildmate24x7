server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: http://localhost:8000 https://cdn.buildmate24x7.com; style-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        # A single valid original may be up to 50 MiB; leave room for multipart headers.
        client_max_body_size 64m;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /health/ {
        proxy_pass http://api:8000/health/;
    }

    location /original/ {
        proxy_pass http://api:8000/original/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /media/ {
        proxy_pass http://api:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
